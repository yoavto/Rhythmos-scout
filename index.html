<html lang="he" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>ריתמוס - פיקוח מזיקים</title>

  <link rel="icon" href="/favicon.png"/>

  <meta name="apple-mobile-web-app-capable" content="yes"/>

  <style>
    :root{--cream:rgb(255,255,255);--red:rgb(137,10,10);--red-dark:rgb(100,5,5);--teal:rgb(19,79,92);--gold:rgb(255,209,63);--text:rgb(69,71,74);--text-muted:rgba(69,71,74,0.6);--border:rgba(137,10,10,0.18);--white:#ffffff;--shadow:0 4px 20px rgba(137,10,10,0.12);--radius:12px;--gtb:70px;--bar:8px;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:Arial,sans-serif;background:var(--cream);color:var(--text);direction:rtl;}
    
    
    
    
    .gnav{background:none;border:none;font-family:Arial,sans-serif;font-size:14px;font-weight:500;color:var(--text-muted);cursor:pointer;padding:5px 16px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all 0.15s;}
    .gnav .gi{font-size:21px;}
    .gnav.active{background:rgba(137,10,10,0.08);color:var(--red);font-weight:700;}
    
    
    
    
    
    #bottom-bar{display:none;position:fixed;bottom:0;left:0;right:0;height:var(--bar);background:var(--red);z-index:1000;}
    #bottom-bar.visible{display:block;}
    .view{display:none;position:fixed;top:0;left:0;right:0;bottom:0;flex-direction:column;overflow:hidden;background:var(--cream);}
    .view.active{display:flex;}
    #view-login{align-items:center;justify-content:center;padding:24px;}
    #map-wrap{position:absolute;inset:0;}
    #map-container{position:absolute;inset:0;}
    .map-type-btn{position:absolute;top:10px;left:10px;background:var(--white);border:none;border-radius:8px;padding:7px 12px;font-size:13px;font-family:Arial,sans-serif;cursor:pointer;box-shadow:var(--shadow);z-index:10;color:var(--text);font-weight:500;}
    .map-fab{position:absolute;bottom:24px;right:16px;background:var(--teal);color:white;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(19,79,92,0.45);display:flex;align-items:center;justify-content:center;z-index:10;}
    .login-card{background:var(--white);border-radius:20px;padding:36px 28px;max-width:400px;width:100%;box-shadow:var(--shadow);}
    .login-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:26px;font-weight:300;}
    .tab-row{display:flex;background:var(--cream);border-radius:8px;padding:3px;margin-bottom:20px;}
    .tab{flex:1;padding:8px;border:none;background:transparent;border-radius:6px;font-family:Arial,sans-serif;font-size:14px;cursor:pointer;color:var(--text-muted);font-weight:500;transition:all 0.2s;}
    .tab.active{background:var(--white);color:var(--red);box-shadow:0 1px 4px rgba(0,0,0,0.1);}
    .fg{margin-bottom:13px;}
    .fl{font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:5px;display:block;}
    .fi{width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:Arial,sans-serif;color:var(--text);background:rgb(235,235,236);outline:none;direction:ltr;text-align:right;}
    .fi:focus{border-color:var(--red);}
    .btn-p{width:100%;padding:13px;background:var(--red);color:white;border:none;border-radius:10px;font-size:15px;font-weight:600;font-family:Arial,sans-serif;cursor:pointer;margin-top:6px;}
    .err{color:var(--red);font-size:13px;margin-top:10px;text-align:center;min-height:18px;}
    .sc{flex:1;overflow-y:auto;padding:16px;}
    .fv{flex:1;overflow-y:auto;padding:16px;}
    .card{background:var(--white);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,0.06);display:flex;align-items:center;gap:12px;cursor:pointer;border-right:4px solid var(--gold);}
    .cb{flex:1;min-width:0;}.ct{font-size:15px;font-weight:600;margin-bottom:2px;}.cs{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ca{display:flex;gap:6px;flex-shrink:0;}.ia{background:none;border:none;font-size:18px;cursor:pointer;padding:4px;border-radius:6px;}
    .cdot{width:26px;height:26px;border-radius:50%;flex-shrink:0;border:2px solid rgba(0,0,0,0.08);}
    .fab-inline{display:flex;justify-content:flex-end;padding:8px 16px 20px;}.fab{background:var(--teal);color:white;border:none;border-radius:50%;width:50px;height:50px;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(19,79,92,0.4);line-height:50px;text-align:center;}
    .fs{background:var(--white);border-radius:var(--radius);padding:15px;margin-bottom:13px;box-shadow:0 1px 6px rgba(0,0,0,0.05);}
    .fst{font-size:11px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:13px;padding-bottom:8px;border-bottom:1px solid var(--border);}
    .fr{margin-bottom:12px;}.frl{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
    .fin{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:Arial,sans-serif;color:var(--text);background:var(--cream);outline:none;}
    .fin:focus{border-color:var(--red);}.fin[type="number"]{direction:ltr;text-align:right;}
    .fta{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:Arial,sans-serif;color:var(--text);background:rgb(235,235,236);outline:none;resize:none;height:80px;}
    .ffoot{display:flex;gap:12px;padding:12px 16px;background:var(--white);border-top:1px solid var(--border);flex-shrink:0;justify-content:center;align-items:center;}
    .btn-sec{padding:10px 23px;background:rgb(69,71,74);color:white;border:none;border-radius:8px;font-size:13px;font-family:Arial,sans-serif;font-weight:600;cursor:pointer;}
    .btn-sav{padding:10px 23px;background:var(--red);color:white;border:none;border-radius:8px;font-size:13px;font-family:Arial,sans-serif;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
    .btn-del{padding:12px;background:transparent;color:#c0392b;border:1.5px solid #c0392b;border-radius:10px;font-size:14px;font-family:Arial,sans-serif;font-weight:500;cursor:pointer;width:100%;margin-bottom:16px;}
    .dfrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;background:var(--cream);border-radius:8px;padding:8px 10px;}
    .dfrow input{flex:1;border:1.5px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;font-family:Arial,sans-serif;background:rgb(235,235,236);outline:none;color:var(--text);}
    .rmf{background:none;border:none;color:#c0392b;font-size:18px;cursor:pointer;flex-shrink:0;}
    .addf{display:flex;align-items:center;gap:6px;background:none;border:1.5px dashed var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-family:Arial,sans-serif;color:var(--teal);cursor:pointer;width:100%;font-weight:500;margin-top:4px;}
    .crow{display:flex;gap:8px;flex-wrap:wrap;}
    .copt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform 0.1s;}
    .copt.sel{border-color:var(--text);transform:scale(1.18);}
    .gbox{background:var(--cream);border-radius:8px;padding:10px 12px;font-size:12px;font-family:monospace;color:var(--teal);display:flex;align-items:center;justify-content:space-between;gap:8px;}
    .gbtn{background:var(--teal);color:white;border:none;border-radius:6px;padding:6px 10px;font-size:12px;font-family:Arial,sans-serif;cursor:pointer;white-space:nowrap;}
    .ichip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:500;border:2px solid var(--border);background:white;color:var(--text);margin:4px;transition:all 0.15s;}
    .trap-hdr{background:var(--teal);color:white;border-radius:var(--radius);padding:14px 16px;margin-bottom:13px;}
    .thn{font-size:16px;font-weight:700;margin-bottom:3px;}.thd{font-size:12px;opacity:0.85;}
    .phbox{background:rgba(255,209,63,0.2);border:1.5px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:13px;display:flex;align-items:center;gap:10px;}
    .finrow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border);}
    .finlbl{font-size:14px;font-weight:500;}
    .fininp{width:90px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:16px;font-weight:600;font-family:Arial,sans-serif;text-align:center;direction:ltr;background:var(--cream);color:var(--text);outline:none;}
    .chkrow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream);border-radius:8px;cursor:pointer;}
    .chkrow input[type="checkbox"]{width:18px;height:18px;accent-color:var(--red);cursor:pointer;flex-shrink:0;}
    .chklbl{font-size:14px;font-weight:500;cursor:pointer;}
    .dpair{display:flex;gap:10px;}.dpair .fr{flex:1;}
    .empty{text-align:center;padding:50px 20px;color:var(--text-muted);}.eico{font-size:48px;margin-bottom:12px;}.empty p{font-size:14px;line-height:1.7;}
    .mover{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1500;align-items:center;justify-content:center;padding:20px;}
    .mover.open{display:flex;}
    .mbox{background:var(--white);border-radius:16px;padding:24px;width:100%;max-width:360px;box-shadow:var(--shadow);}
    .mtitle{font-size:16px;font-weight:700;color:var(--red);margin-bottom:10px;}
    .mmsg{font-size:14px;color:var(--text-muted);margin-bottom:20px;line-height:1.6;}
    .mfoot{display:flex;gap:10px;}
    .btn-mcan{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:10px;background:white;font-family:Arial,sans-serif;font-size:14px;cursor:pointer;color:var(--text-muted);}
    .btn-mok{flex:1;padding:11px;background:#c0392b;color:white;border:none;border-radius:10px;font-family:Arial,sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
    #maps-gate{position:fixed;inset:0;background:var(--cream);z-index:9000;display:none;align-items:center;justify-content:center;padding:24px;}
    #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--teal);color:white;padding:10px 20px;border-radius:20px;font-size:14px;font-family:Arial,sans-serif;z-index:9999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
    #toast.show{opacity:1;}

    #gtb.visible { display:flex; }
    /* In RTL flex: first child = RIGHT side, last child = LEFT side */
    .gtb-right { width:90px; display:flex; align-items:center; justify-content:flex-end; padding-left:8px; flex-shrink:0; }
    .gtb-nav   { flex:1; display:flex; justify-content:center; align-items:center; }
    .gtb-left  { width:90px; display:flex; align-items:center; justify-content:flex-start; padding-right:8px; gap:4px; flex-shrink:0; }
    .gtb-logo  { height:34px; width:auto; mix-blend-mode:multiply; }
    .gnav      { background:none; border:none; font-family:Arial,sans-serif; font-size:14px; font-weight:500; color:rgb(69,71,74); cursor:pointer; padding:5px 14px; border-radius:8px; display:flex; flex-direction:column; align-items:center; gap:2px; transition:all 0.15s; }
    .gnav .gi  { font-size:21px; }

    .gtb-exit-wrap { position:absolute; left:10px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:6px; }
    /* Back btn inside exit-wrap, hidden by default */
    
    #exit-btn { background:none; border:none; cursor:pointer; padding:4px; color:rgba(69,71,74,0.5); width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
    #exit-btn:hover { color:var(--red); }
    #exit-btn svg { width:20px; height:20px; transform:scaleX(-1); }
    /* Nav always centered, full width (absolute items don't affect flow) */
    .gtb-nav { flex:1; display:flex; justify-content:center; align-items:center; }
    .gnav { background:none; border:none; font-family:Arial,sans-serif; font-size:14px; font-weight:500; color:rgb(69,71,74); cursor:pointer; padding:5px 14px; border-radius:8px; display:flex; flex-direction:column; align-items:center; gap:2px; transition:all 0.15s; }
    .gnav .gi { font-size:21px; }
    .gnav.active { background:rgba(137,10,10,0.1); color:var(--red); font-weight:700; }
    #back-btn{display:none;align-items:center;gap:4px;flex-direction:row;direction:ltr;padding:5px 10px;background:white;border:2px solid rgb(137,10,10);border-radius:8px;font-family:Arial,sans-serif;font-size:12px;font-weight:600;color:rgb(69,71,74);cursor:pointer;white-space:nowrap;}
    
    /* ── MOBILE / PWA ── */
    @media (max-width: 480px) {
      .gnav { padding: 4px 8px; font-size: 11px; }
      .gnav .gi { font-size: 18px; }
      #back-btn { font-size: 11px; padding: 4px 8px; }
      .gtb-logo { height: 26px; }
      .card { padding: 11px 12px; }
      .btn-sav, .btn-sec { padding: 10px 16px; font-size: 13px; }
    }
    /* Safe area for notched phones */
    #gtb { padding-top: env(safe-area-inset-top); }
    #bottom-bar { height: calc(var(--bar) + env(safe-area-inset-bottom)); }
    .view { top: var(--gtb); bottom: var(--bar); }

  </style>
</head>

async function doLogin(){const email=document.getElementById('l-email').value.trim(),remember=document.getElementById('remember-me').checked;try{await auth.setPersistence(remember?firebase.auth.Auth.Persistence.LOCAL:firebase.auth.Auth.Persistence.SESSION);await auth.signInWithEmailAndPassword(email,document.getElementById('l-pw').value);if(remember)localStorage.setItem('r_saved_email',email);else localStorage.removeItem('r_saved_email');}catch(e){document.getElementById('auth-err').textContent=authMsg(e.code);}}

async function doLogout(){await auth.signOut();}
function authMsg(c){return({'auth/invalid-email':'אימייל לא תקין','auth/user-not-found':'משתמש לא נמצא','auth/wrong-password':'סיסמה שגויה','auth/invalid-credential':'אימייל או סיסמה שגויים','auth/email-already-in-use':'אימייל כבר רשום','auth/weak-password':'סיסמה חלשה מדי'})[c]||'שגיאת התחברות';}
function checkMapsKey(){const k=localStorage.getItem('r_maps_key');if(k)loadMaps(k);else document.getElementById('maps-gate').style.display='flex';}
function saveMapsKey(){const k=document.getElementById('maps-key-input').value.trim();if(!k||k.length<20){showToast('נא להזין מפתח תקין');return;}localStorage.setItem('r_maps_key',k);document.getElementById('maps-gate').style.display='none';loadMaps(k);}
function loadMaps(k){if(window.google?.maps){initApp();return;}const s=document.createElement('script');s.src=`https://maps.googleapis.com/maps/api/js?key=${k}&loading=async&callback=initApp`;s.async=true;s.onerror=()=>{document.getElementById('maps-gate').style.display='flex';showToast('שגיאה במפתח - בדוק מפתח ו-API');};document.head.appendChild(s);}
window.initApp=async function(){await loadInsects();await loadTraps();showV('map');setTimeout(initMap,150);};
function initMap(){
  document.getElementById('map-wrap').style.top='0';
  document.getElementById('map-wrap').style.bottom='0';
  map=new google.maps.Map(document.getElementById('map-container'),{center:{lat:31.8,lng:34.9},zoom:13,mapTypeId:'hybrid',disableDefaultUI:true,gestureHandling:'greedy',clickableIcons:false});
  // Center to user's location on load + show blue dot
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>{map.panTo({lat:p.coords.latitude,lng:p.coords.longitude});map.setZoom(15);updateLocationDot(p);},
      ()=>{}
    );
    // Keep dot updated as user moves
    navigator.geolocation.watchPosition(
      p=>updateLocationDot(p),
      ()=>{}, {enableHighAccuracy:true, maximumAge:10000}
    );
  }
  map.addListener('click',e=>{
    if(!mapPickMode)return;
    const la=e.latLng.lat(),ln=e.latLng.lng();
    if(mapPickMarker)mapPickMarker.setMap(null);
    mapPickMarker=new google.maps.Marker({position:{lat:la,lng:ln},map,icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:'#134f5c',fillOpacity:1,strokeColor:'white',strokeWeight:2}});
    document.getElementById('tf-lat').value=la;document.getElementById('tf-lng').value=ln;
    document.getElementById('gps-disp').textContent=la.toFixed(6)+', '+ln.toFixed(6);
    mapPickMode=false;map.setOptions({draggableCursor:null});showToast('מיקום נקבע');
    navTo('trap-form');
  });
  renderMarkers();
}
function toggleMapType(){mapType=mapType==='hybrid'?'roadmap':'hybrid';map.setMapTypeId(mapType);document.querySelector('.map-type-btn').textContent=mapType==='hybrid'?'🛰️ לוויין':'🗺️ מפה';}
function locateMe(){if(!navigator.geolocation){showToast('GPS לא זמין');return;}navigator.geolocation.getCurrentPosition(p=>{map.panTo({lat:p.coords.latitude,lng:p.coords.longitude});map.setZoom(17);updateLocationDot(p);},()=>showToast('לא ניתן לקבל מיקום'));}
function renderMarkers(){Object.values(trapMarkers).forEach(m=>m.setMap(null));trapMarkers={};traps.forEach(addMarker);}

// ── Location dot (blue, like Google Maps) ──
let locationDot=null, locationCircle=null;
function updateLocationDot(pos){
  const latlng={lat:pos.coords.latitude, lng:pos.coords.longitude};
  if(!map)return;
  if(!locationDot){
    locationDot=new google.maps.Marker({
      position:latlng, map,
      icon:{
        path:google.maps.SymbolPath.CIRCLE,
        scale:9,
        fillColor:'#4285F4',
        fillOpacity:1,
        strokeColor:'white',
        strokeWeight:2.5
      },
      zIndex:200,
      title:'מיקומך'
    });
    locationCircle=new google.maps.Circle({
      map, center:latlng,
      radius:pos.coords.accuracy,
      fillColor:'#4285F4', fillOpacity:0.12,
      strokeColor:'#4285F4', strokeOpacity:0.4, strokeWeight:1
    });
  } else {
    locationDot.setPosition(latlng);
    locationCircle.setCenter(latlng);
    locationCircle.setRadius(pos.coords.accuracy);
  }
}
function addMarker(trap){if(!map||!trap.lat||!trap.lng)return;const ins=insects.find(i=>i.id===trap.insectId);const col=ins?.color||'#8B1A1A';const m=new google.maps.Marker({position:{lat:trap.lat,lng:trap.lng},map,title:`${ins?.name||'?'} | ${trap.plot||''} שורה ${trap.row||''} עץ ${trap.tree||''}`,icon:{path:'M 0,-16 C -6,-16 -10,-11 -10,-6 C -10,2 0,14 0,14 C 0,14 10,2 10,-6 C 10,-11 6,-16 0,-16 Z',fillColor:col,fillOpacity:0.93,strokeColor:'white',strokeWeight:1.5,scale:1,anchor:new google.maps.Point(0,14)},zIndex:100});m.addListener('click',()=>openInspection(trap.id));trapMarkers[trap.id]=m;}
function startMapPick(){if(!map){showToast('המפה לא נטענה עדיין');return;}mapPickMode=true;map.setOptions({draggableCursor:'crosshair'});showToast('לחץ על המפה לסימון מיקום המלכודת');navTo('map');}
function navTo(s){curView=s;showV(s);if(s==='insects')renderInsects();if(s==='traps')renderTraps();if(s==='export')prepExport();if(s==='map'&&map)setTimeout(()=>google.maps.event.trigger(map,'resize'),50);updateTopBar(s);}
function showV(n){curView=n;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));const el=document.getElementById('view-'+n);if(el){el.classList.add('active');if(n!=='login'){el.style.top=GTB_H+'px';el.style.bottom=BAR_H+'px';}else{el.style.top='0';el.style.bottom='0';}}updateTopBar(n);}
function updateTopBar(v){
  const MAIN=['map','traps','insects','export'];
  MAIN.forEach(t=>{const b=document.getElementById('gnav-'+t);if(b)b.classList.toggle('active',t===v);});
  const bb=document.getElementById('back-btn');
  const eb=document.getElementById('exit-btn');
  const isMain=MAIN.includes(v);
  if(bb)bb.style.display=isMain?'none':'flex';
  if(eb)eb.style.display=isMain?'flex':'none';
}
function goBack(){navTo(BACK[curView]||'map');}
async function loadInsects(){const s=await db.collection('insects').orderBy('createdAt').get();insects=s.docs.map(d=>({id:d.id,...d.data()}));}
function renderInsects(){const el=document.getElementById('insects-list');const fab='<div class="fab-inline"><button class="fab" onclick="openInsectForm(null)">+</button></div>';if(!insects.length){el.innerHTML='<div class="empty"><div class="eico">🐛</div><p>אין מזיקים מוגדרים.<br>לחץ + להוספה.</p></div>'+fab;return;}el.innerHTML=insects.map(i=>`<div class="card" onclick="openInsectForm('${i.id}')" style="border-right-color:${i.color}"><div class="cdot" style="background:${i.color}"></div><div class="cb"><div class="ct">${i.name}</div><div class="cs">${i.fields.map(f=>f.label).join(' • ')}</div></div><div class="ca"><button class="ia" onclick="event.stopPropagation();openInsectForm('${i.id}')">✏️</button></div></div>`).join('')+fab;}
function openInsectForm(id){selColor='#c0392b';dynFields=[];document.getElementById('if-id').value=id||'';document.getElementById('if-name').value='';document.getElementById('if-del-wrap').style.display=id?'block':'none';if(id){const i=insects.find(x=>x.id===id);if(i){document.getElementById('if-name').value=i.name;selColor=i.color;dynFields=i.fields.map(f=>({...f}));}}else dynFields.push({label:''});renderColorRow();renderDynF();showV('insect-form');updateTopBar('insect-form');}
function renderColorRow(){document.getElementById('color-row').innerHTML=COLORS.map(c=>`<div class="copt ${c===selColor?'sel':''}" style="background:${c}" onclick="pickCol('${c}',this)"></div>`).join('');}
function pickCol(c,el){selColor=c;document.querySelectorAll('.copt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');}
function addDynF(){dynFields.push({label:''});renderDynF();}
function renderDynF(){document.getElementById('dynf-container').innerHTML=dynFields.map((f,i)=>`<div class="dfrow"><input type="text" value="${f.label}" placeholder="שם שדה, למשל: זכרים" oninput="dynFields[${i}].label=this.value"/><button class="rmf" onclick="rmDynF(${i})">✕</button></div>`).join('');}
function rmDynF(i){dynFields.splice(i,1);renderDynF();}
async function saveInsect(){const name=document.getElementById('if-name').value.trim();if(!name){showToast('נא להזין שם מזיק');return;}const fields=dynFields.filter(f=>f.label.trim());if(!fields.length){showToast('נא להוסיף לפחות שדה ממצא אחד');return;}const id=document.getElementById('if-id').value;const data={name,color:selColor,fields:fields.map(f=>({label:f.label.trim(),type:'number'})),updatedAt:firebase.firestore.FieldValue.serverTimestamp()};try{if(id)await db.collection('insects').doc(id).update(data);else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('insects').add(data);}await loadInsects();renderMarkers();showToast('המזיק נשמר');navTo('insects');}catch(e){showToast('שגיאה: '+e.message);}}
function confirmDelInsect(){const id=document.getElementById('if-id').value;const ins=insects.find(i=>i.id===id);showConfirm('מחיקת מזיק',`האם למחוק את "${ins?.name}"?`,async()=>{await db.collection('insects').doc(id).delete();await loadInsects();renderInsects();renderMarkers();showToast('המזיק נמחק');navTo('insects');});}
async function loadTraps(){const s=await db.collection('traps').orderBy('createdAt').get();traps=s.docs.map(d=>({id:d.id,...d.data()}));}
function renderTraps(){const el=document.getElementById('traps-list');const fab='<div class="fab-inline"><button class="fab" onclick="openTrapForm(null)">+</button></div>';if(!traps.length){el.innerHTML='<div class="empty"><div class="eico">📍</div><p>אין מלכודות.<br>לחץ + להוספה.</p></div>'+fab;return;}el.innerHTML=traps.map(t=>{const ins=insects.find(i=>i.id===t.insectId);const col=ins?.color||'#8B1A1A';return `<div class="card" onclick="openInspection('${t.id}')" style="border-right-color:${col}"><div class="cdot" style="background:${col}"></div><div class="cb"><div class="ct">${ins?.name||'מזיק לא ידוע'}</div><div class="cs">גידול: ${t.crop||'—'} | חלקה: ${t.plot||'—'} | שורה: ${t.row||'—'} | עץ: ${t.tree||'—'}</div>${t.pheromoneDate?`<div class="cs" style="margin-top:2px">🧪 פרומון: ${fd(t.pheromoneDate)}</div>`:''}</div><div class="ca"><button class="ia" onclick="event.stopPropagation();openTrapForm('${t.id}')">✏️</button></div></div>`;}).join('')+fab;}
function openTrapForm(id){selTrapIns=null;document.getElementById('tf-id').value=id||'';document.getElementById('tf-lat').value='';document.getElementById('tf-lng').value='';document.getElementById('gps-disp').textContent='לא נקלט מיקום';['tf-crop','tf-plot','tf-row','tf-tree'].forEach(f=>document.getElementById(f).value='');document.getElementById('tf-phdate').value=di(new Date());document.getElementById('tf-del-wrap').style.display=id?'block':'none';if(id){const t=traps.find(x=>x.id===id);if(t){selTrapIns=t.insectId;document.getElementById('tf-crop').value=t.crop||'';document.getElementById('tf-plot').value=t.plot||'';document.getElementById('tf-row').value=t.row||'';document.getElementById('tf-tree').value=t.tree||'';if(t.lat&&t.lng){document.getElementById('tf-lat').value=t.lat;document.getElementById('tf-lng').value=t.lng;document.getElementById('gps-disp').textContent=t.lat.toFixed(6)+', '+t.lng.toFixed(6);}if(t.pheromoneDate)document.getElementById('tf-phdate').value=t.pheromoneDate;}}else captureGPS();renderIChips();showV('trap-form');updateTopBar('trap-form');}
function renderIChips(){const g=document.getElementById('ichip-grid');if(!insects.length){g.innerHTML='<p style="font-size:13px;color:var(--text-muted)">אין מזיקים מוגדרים. הגדר מזיק תחילה.</p>';return;}g.innerHTML='<div style="display:flex;flex-wrap:wrap;">'+insects.map(i=>{const s=selTrapIns===i.id;return `<div class="ichip" style="border-color:${s?i.color:'var(--border)'};background:${s?i.color:'white'};color:${s?'white':'var(--text)'}" onclick="pickTrapIns('${i.id}')"><span style="width:10px;height:10px;border-radius:50%;background:${s?'white':i.color};flex-shrink:0;display:inline-block;"></span>${i.name}</div>`;}).join('')+'</div>';}
function pickTrapIns(id){selTrapIns=id;renderIChips();}
function captureGPS(){if(!navigator.geolocation){showToast('GPS לא זמין');return;}showToast('קולט מיקום...');navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude,ln=p.coords.longitude;document.getElementById('tf-lat').value=la;document.getElementById('tf-lng').value=ln;document.getElementById('gps-disp').textContent=la.toFixed(6)+', '+ln.toFixed(6);showToast('מיקום נקלט');},()=>showToast('שגיאה בקליטת מיקום'));}
async function saveTrap(){if(!selTrapIns){showToast('נא לבחור סוג מזיק');return;}const id=document.getElementById('tf-id').value;const la=parseFloat(document.getElementById('tf-lat').value);const ln=parseFloat(document.getElementById('tf-lng').value);const data={insectId:selTrapIns,crop:document.getElementById('tf-crop').value.trim(),plot:document.getElementById('tf-plot').value.trim(),row:document.getElementById('tf-row').value.trim(),tree:document.getElementById('tf-tree').value.trim(),pheromoneDate:document.getElementById('tf-phdate').value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};if(!isNaN(la)&&!isNaN(ln)){data.lat=la;data.lng=ln;}try{if(id)await db.collection('traps').doc(id).update(data);else{data.createdAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('traps').add(data);}await loadTraps();renderMarkers();showToast('המלכודת נשמרה');navTo('traps');}catch(e){showToast('שגיאה: '+e.message);}}
function deleteTrap(){const id=document.getElementById('tf-id').value;showConfirm('מחיקת מלכודת','האם למחוק את המלכודת? לא ניתן לביטול.',async()=>{await db.collection('traps').doc(id).delete();await loadTraps();renderMarkers();showToast('המלכודת נמחקה');navTo('traps');});}
function openInspection(trapId){const trap=traps.find(t=>t.id===trapId);if(!trap){showToast('מלכודת לא נמצאה');return;}const ins=insects.find(i=>i.id===trap.insectId);curTrapId=trapId;const phDate=trap.pheromoneDate?fd(trap.pheromoneDate):'לא הוזן';document.getElementById('insp-content').innerHTML=`<div class="trap-hdr"><div class="thn">${ins?.name||'מזיק לא ידוע'}</div><div class="thd">גידול: ${trap.crop||'—'} | חלקה: ${trap.plot||'—'} | שורה: ${trap.row||'—'} | עץ: ${trap.tree||'—'}</div></div><div class="phbox"><span style="font-size:20px;">🧪</span><div><div style="font-weight:700;font-size:13px;">פרומון אחרון</div><div style="font-size:14px;">${phDate}</div></div></div><div class="fs"><div class="fst">ממצאים</div>${ins?ins.fields.map((f,i)=>`<div class="finrow"><label class="finlbl">${f.label}</label><input class="fininp" type="number" id="fi-${i}" min="0" value="0" inputmode="numeric"/></div>`).join(''):'<p style="font-size:13px;color:var(--text-muted)">מזיק לא מוגדר</p>'}</div><div class="fs"><div class="fst">פרומון</div><label class="chkrow"><input type="checkbox" id="ph-chk" onchange="togglePhDate(this)"/><span class="chklbl">החלפתי פרומון היום</span></label><div id="ph-date-row" style="display:none;margin-top:12px;"><label class="frl">תאריך החלפה</label><input class="fin" type="date" id="ph-new-date" value="${di(new Date())}"/></div></div><div class="fs"><div class="fst">הערות</div><textarea class="fta" id="insp-comments" placeholder="הערות..."></textarea></div>`;showV('inspection');updateTopBar('inspection');}
function togglePhDate(cb){document.getElementById('ph-date-row').style.display=cb.checked?'block':'none';}
async function saveInspection(){const trap=traps.find(t=>t.id===curTrapId);const ins=insects.find(i=>i.id===trap?.insectId);if(!trap||!ins){showToast('שגיאה');return;}const findings={};ins.fields.forEach((f,i)=>{findings[f.label]=parseInt(document.getElementById(`fi-${i}`)?.value)||0;});const phR=document.getElementById('ph-chk').checked;const phD=phR?document.getElementById('ph-new-date').value:null;const data={trapId:curTrapId,insectId:trap.insectId,insectName:ins.name,trapSnapshot:{crop:trap.crop,plot:trap.plot,row:trap.row,tree:trap.tree},findings,pheromoneReplaced:phR,pheromoneReplacedDate:phD,comments:document.getElementById('insp-comments').value.trim(),inspectedAt:firebase.firestore.FieldValue.serverTimestamp(),createdAt:firebase.firestore.FieldValue.serverTimestamp()};try{await db.collection('inspections').add(data);if(phR&&phD){await db.collection('traps').doc(curTrapId).update({pheromoneDate:phD});await loadTraps();renderMarkers();}showToast('הסקר נשמר');navTo('map');}catch(e){showToast('שגיאה: '+e.message);}}
function prepExport(){const now=new Date(),from=new Date(now.getFullYear(),now.getMonth(),1);document.getElementById('ex-from').value=di(from);document.getElementById('ex-to').value=di(now);const sel=document.getElementById('ex-ins');sel.innerHTML='<option value="">כל המזיקים</option>'+insects.map(i=>`<option value="${i.id}">${i.name}</option>`).join('');}
async function exportCSV(){
  const from=document.getElementById('ex-from').value,
        to=document.getElementById('ex-to').value,
        inf=document.getElementById('ex-ins').value;
  if(!from||!to){showToast('נא לבחור תאריכים');return;}
  showToast('מייצא...');
  let q=db.collection('inspections').orderBy('inspectedAt');
  if(inf)q=q.where('insectId','==',inf);
  const snap=await q.get();
  const fnames=new Set();
  snap.docs.forEach(d=>{Object.keys(d.data().findings||{}).forEach(k=>fnames.add(k));});
  const fn=[...fnames];
  const headers=['תאריך','שעה','מזיק','גידול','חלקה','שורה','עץ',...fn,'פרומון הוחלף','תאריך החלפת פרומון','הערות'];
  const dataRows=[];
  snap.docs.forEach(d=>{
    const rec=d.data();
    const dt=rec.inspectedAt?.toDate?rec.inspectedAt.toDate():new Date();
    const dateOnly=di(dt);
    if(dateOnly<from||dateOnly>to)return;
    // Pheromone date: use replacement date from this inspection, else fall back to trap's last known date
    const trap=traps.find(t=>t.id===rec.trapId);
    const phDate=rec.pheromoneReplacedDate||trap?.pheromoneDate||'';
    dataRows.push([
      dt.toLocaleDateString('he-IL'),
      dt.toLocaleTimeString('he-IL'),
      rec.insectName||'',
      rec.trapSnapshot?.crop||'',
      rec.trapSnapshot?.plot||'',
      rec.trapSnapshot?.row||'',
      rec.trapSnapshot?.tree||'',
      ...fn.map(f=>rec.findings?.[f]??''),
      rec.pheromoneReplaced?'כן':'לא',
      phDate?fd(phDate):'',
      rec.comments||''
    ]);
  });
  if(!dataRows.length){showToast('אין נתונים בטווח שנבחר');return;}
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet([headers,...dataRows]);
  ws['!cols']=headers.map((_,i)=>({wch:i<2?12:16}));
  
  XLSX.utils.book_append_sheet(wb,ws,'\u05E1\u05E7\u05E8\u05D9\u05DD');
  XLSX.writeFile(wb,'rhythmos-scout-'+from+'-'+to+'.xlsx');
  showToast('יוצאו '+dataRows.length+' רשומות');
}
function di(d){return d.toISOString().slice(0,10);}
function fd(s){if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function showConfirm(title,msg,cb){document.getElementById('cm-title').textContent=title;document.getElementById('cm-msg').textContent=msg;document.getElementById('confirm-modal').classList.add('open');confirmCb=cb;}
function closeConfirm(ok){document.getElementById('confirm-modal').classList.remove('open');if(ok&&confirmCb)confirmCb();confirmCb=null;}
document.getElementById('maps-key-input')?.addEventListener('keydown',e=>{if(e.key==='Enter')saveMapsKey();});
</script>

<script>

// ── Android back button: double-tap to exit ───────────────────────
let backPressedOnce = false;
let backTimer = null;
const MAIN_VIEWS = ['map','traps','insects','export'];

function handleAndroidBack() {
  if (!MAIN_VIEWS.includes(curView)) {
    goBack();
    history.pushState({pwa:true}, '');
    return;
  }
  if (backPressedOnce) {
    clearTimeout(backTimer);
    return; // allow browser to close/go back
  }
  backPressedOnce = true;
  showToast('לחץ שוב לצאת');
  history.pushState({pwa:true}, '');
  backTimer = setTimeout(() => { backPressedOnce = false; }, 2000);
}

window.addEventListener('popstate', handleAndroidBack);
window.addEventListener('load', () => { history.pushState({pwa:true}, ''); });


// Unregister any existing service workers so cache never blocks updates
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
}
</script>
